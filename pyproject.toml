# Config-only pyproject (Go repo): carries agentic-os hook settings, same
# pattern as coilyco-bridge/deploy.

[tool.agentic-os.repo-pointer-skills]
# This repo lives under the coilyco-gaming org dir, so its repo-pointer
# skill points at ~/projects/coilyco-gaming/. Needs agentic-os >= v0.18.0.
org = "coilyco"

[tool.agentic-os.documentation-layout]
band = "large"
excludes = [
    # Evaluation records under eval/<record>/, read top to bottom as one record.
    "eval/**",
    # agent-compose person-package entities, not this repository's docs. See
    # docs/sirens-echo-person.md.
    "agent/compose/person/**",
]
# Splitting a run record to fit a cap is how it stops reading as one record.
size_excludes = ["eval/**"]

[tool.agentic-os.code-comments]
# Not a grandfathered violation: all three flagged comments are emitted by
# apply-agentic-os-hooks.py at fixed positions inside its managed block, so no
# in-repo edit survives the next rollout. agentic-os excludes its own copy for
# the same reason. Drop this once the hook skips managed marker regions.
excludes = [
    ".pre-commit-config.yaml",
    # Committed run evidence under eval/<record>/ stays verbatim.
    "eval/**",
]
