repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: mixed-line-ending

  - repo: local
    hooks:
      - id: go-mod-tidy
        name: go mod tidy
        entry: go mod tidy
        language: system
        files: '(go\.mod|go\.sum)$'
        pass_filenames: false

      - id: go-vet
        name: go vet
        entry: go vet ./...
        language: system
        types: [go]
        pass_filenames: false

      - id: trufflehog
        name: trufflehog (secret scan, offline)
        description: Detect secrets in staged changes via local trufflehog binary (no API verification).
        entry: trufflehog git file://. --since-commit HEAD --no-verification --no-update --fail
        language: system
        pass_filenames: false
        stages: [pre-commit, pre-push]

  # BEGIN managed by agentic-os/scripts/apply-agentic-os-hooks.py
  - repo: https://forgejo.coilysiren.me/coilyco-flight-deck/agentic-os
    rev: v0.65.0
    hooks:
      - id: catalog-doc-size
      - id: catalog-trifecta
      - id: documentation-layout
      - id: context-load-points
      - id: code-comments
      - id: catalog-block-present
      - id: check-skills
      - id: dead-cross-links
      - id: repo-pointer-skills
      - id: misplaced-skills
      - id: agent-compose-size
      - id: agent-compose-dedup
      - id: trufflehog
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
        args: [--assume-in-merge]
  # END managed by agentic-os/scripts/apply-agentic-os-hooks.py
