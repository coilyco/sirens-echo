repos:
  - repo: local
    hooks:
      - id: go-mod-tidy
        name: go mod tidy
        entry: go mod tidy
        language: system
        files: '(go\.mod|go\.sum)$'
        pass_filenames: false

      - id: prompt-snapshot
        name: rendered prompt snapshots
        description: Keep agent/rendered in step with the definitions, policy roots, and prompt builder.
        entry: go run ./cmd/sirens-echo-prompt --check
        language: system
        pass_filenames: false
        files: '^(agent/|\.agents/skills/|internal/community/prompt\.go|internal/community/skillpack\.go|cmd/sirens-echo-prompt/)'

      - id: gofmt
        name: gofmt
        description: Rewrite Go sources to gofmt output, so unformatted code cannot reach main.
        entry: gofmt -l -w
        language: system
        types: [go]

      - id: go-vet
        name: go vet
        entry: go vet ./...
        language: system
        types: [go]
        pass_filenames: false

      - id: eval-live-guard
        name: no live eval output in the tracked tree
        description: Refuse a dataset a run against a live roster wrote, since it carries real tool output.
        entry: go run ./cmd/sirens-echo-live-check
        language: system
        files: '^(eval/|agents/.+/evaluations/|\.eval-live/)'

      - id: trufflehog
        name: trufflehog (secret scan, offline)
        description: Detect secrets in staged changes via local trufflehog binary (no API verification).
        entry: trufflehog git file://. --since-commit HEAD --no-verification --no-update --fail
        language: system
        pass_filenames: false
        stages: [pre-commit, pre-push]

  # BEGIN managed by agentic-os/scripts/apply-agentic-os-hooks.py
  - repo: https://forgejo.coilysiren.me/coilyco-flight-deck/agentic-os
    rev: aos-precommit-v0.55.0
    hooks:
      - id: catalog-doc-size
      - id: catalog-trifecta
      - id: documentation-layout
      - id: context-load-points
      - id: code-comments
      - id: actions-run-one-line
      - id: source-doc-refs
      - id: check-skills
      - id: dead-cross-links
      - id: repo-pointer-skills
      - id: misplaced-skills
      - id: agent-compose-size
      - id: agent-compose-dedup
      - id: trufflehog
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-added-large-files
        args: [--maxkb=2048]
      - id: check-merge-conflict
        args: [--assume-in-merge]
      - id: check-case-conflict
      - id: check-illegal-windows-names
      - id: mixed-line-ending
      - id: check-json
      - id: check-toml
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      # Forgejo workflows use GitHub Actions syntax; no exclude split is needed yet.
      - id: actionlint
        args:
          - -config-file
          - .github/actionlint.yaml
        files: ^\.forgejo/workflows/.*\.(ya?ml)$
  - repo: https://code.forgejo.org/forgejo/runner
    rev: v12.10.1
    hooks:
      - id: forgejo-runner-validate
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        exclude: ^shell/(zshrc|warp\.zsh)$
        args: [--severity=error]
  - repo: https://github.com/crate-ci/typos
    rev: v1.48.0
    hooks:
      - id: typos
        args: []
  # END managed by agentic-os/scripts/apply-agentic-os-hooks.py
