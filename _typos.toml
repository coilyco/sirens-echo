# Recorded evidence, not prose. A trace or span ID is hex, so letter runs inside
# one resemble words on every run: b885f60f469ff3ba reads as "ba" and
# 236e245caf5ab98b as "caf". Correcting one would falsify the record.
#
# Matched by shape rather than by listing each identifier, because a new
# evaluation run mints new ones and a list would need an entry per run.
[default]
extend-ignore-re = [
  "\\b[0-9a-f]{12,}\\b",
  "\\bser8\\b",
]
