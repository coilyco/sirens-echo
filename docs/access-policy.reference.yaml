# REFERENCE COPY ONLY. The runtime never reads this file, and every ID is a placeholder.
# The real policy is a ConfigMap in coilyco-bridge/deploy. See docs/sirens-echo-access.md.

schema: coilyco-harness.access.v1

deny:
  users:
    - "9990000000000000001"

agents:
  allow: []

direct_messages:
  allow:
    - "1024000000000000001"

guilds:
  - id: "2048000000000000001"
    note: "Sirens - operator's own guild"
    channels: all
    users: all
    rate_limit:
      per_user: "30/60s"

  - id: "3072000000000000001"
    note: "Partner guild - bot answers in #ask-coilyco only"
    channels:
      - "4096000000000000001"
    users:
      - "1024000000000000001"
    roles:
      - "5120000000000000001"
    rate_limit:
      per_user: "2/60s"
      per_context: "6/30s"
