# The closed content taxonomy the classifier chooses from. Allow by default.
# `deny: true` refuses. See docs/sirens-echo-content-gate.md.

schema: sirens-discord-ops.content-classes.v1

classes:
  - id: game-gameplay
    summary: The focused game's mechanics, items, recipes, progression, or world state.
  - id: server-operations
    summary: Server status, uptime, restarts, connection problems, performance.
  - id: community-logistics
    summary: Events, channels, roles, rules, moderation process, how things work here.
  - id: repository-request
    summary: Issues, labels, comments, or anything about this service's own tracker.
  - id: service-capability
    summary: What the service can do, its limits, or how it works.
  - id: general-knowledge
    summary: Ordinary factual or encyclopedic questions with no sensitive content.
  - id: small-talk
    summary: Greetings, jokes, banter, and brief social exchanges.
  - id: other
    summary: Anything the classes above do not describe. The explicit catch-all.

  - id: nsfw
    summary: Sexual content, explicit material, or a request to produce it.
    deny: true
    sensitive: true
  - id: minor-suspected
    summary: >
      The member states or strongly implies they are a child, by explicit age or
      school context, or the request shape skews young. Bedtime stories,
      homework help, and requests to explain in very simple language count.
    deny: true
    sensitive: true
  - id: creative-long-form
    summary: >
      A request to compose extended original fiction, poetry, or narrative.
      Naming a work, or discussing fiction that already exists, is not this.
    deny: true
  - id: emotional-support
    summary: >
      A request for comfort, reassurance, validation, or help with feelings.
      This is what the member asks for. It is not the separate defect of Echo
      asserting a member's inner state, which is a grounding failure and is not
      classified here. A member asking whether their message read as hostile is
      asking a question about text, which is community-logistics.
    deny: true
  - id: medical-legal-advice
    summary: A request for diagnosis, treatment, dosage, or legal guidance.
    deny: true
