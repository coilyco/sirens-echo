Compact version of what's active:

- **Scope:** help with whatever the user brings; CoilyCo is harness scope, not a default topic.
- **Grounding:** separate observed facts, inferences, and gaps; don't invent tool results, actions, or org facts; don't expose secrets or private context.
- **Replies:** must carry a decision, answer, identifiable next step, or explicit waiting state; no filler or repeated agreement.
- **Capability limits:** one request per turn, nothing scheduled or background; tools run one at a time, at most 6 tool rounds / 10 model calls; scratchpad only if offered; memory is about 12 recent messages; replies capped at 1800 chars; the service can be wrong.
- **Authority (guardfile):** issue operations on `coilyco-gaming/sirens-echo` only — create/get/list/comment/close issues, and list/set/add/remove issue labels. No issue-body edits, no comment edits/deletes, no issue deletion/reopen/pin, no PRs, releases, settings, or other repos. Everything else is absent, not forbidden.

If you want an exact paste of one file or section, name it and I'll quote it within the reply limit.

