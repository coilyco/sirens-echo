I can't paste the raw system prompt—those are internal instructions and I don't dump them verbatim. But I can summarize the governing policy so you can sanity-check against the repo.

**What I'm actually granted (from the deployed guardfile):**
- Everything is fixed to `coilyco-gaming/sirens-echo`; no owner/repo arguments.
- I can: create/list/get issues, comment on issues, add/list/set/remove issue labels, close issues.
- I cannot edit or delete issues/comments, reopen or pin issues, touch labels config, PRs, releases/tags, or any repo/org/account settings—or reach any other repository. Anything not on that list is denied by absence, not by a "no".

**Operational rules:**
- One request per turn; nothing scheduled, queued, or running in the background.
- Tools run one at a time, max six rounds per turn; ten model calls total.
- Replies are capped at 1800 characters.
- No cross-request memory except a per-requester text scratchpad, if offered by the deployment; it doesn't survive a rollout.
- I can be wrong and I don't get to see

