name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: docker
    container: forgejo.coilysiren.me/coilyco-flight-deck/agentic-os:v0.195.0
    steps:
      - uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: make build
        run: make build

      - name: make vet
        run: make vet

      - name: make test
        run: make test

      - name: pre-commit
        run: pre-commit run --all-files --show-diff-on-failure
