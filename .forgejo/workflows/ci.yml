# THE JOB STORE SERVICE. `jobstore` is a scratch Postgres thrown away with the
# job, never the deployed store: the test creates its table and drops it.
# Without it the Postgres store's SQL has no coverage anywhere, which is the
# silent-success shape docs/sirens-echo-testing.md exists to catch.
#
# Its DSN is scoped to the `job store SQL` step rather than the job, so the
# suite above it still skips those tests and scripts/test-skips.allow stays true
# locally and in CI alike. See docs/sirens-echo-jobs.md.
#
# That step runs through ci-job-store-sql.sh rather than a bare `go test`,
# because go test prints ok for a skip: a service that never came up would
# otherwise leave the one step whose job is to run that SQL green having run
# none of it.
#
# THE ROLE COMPOSE CHECK runs here as well as at Dockerfile step 26. The image
# build is what stops a bad image; this step is what says so in seconds rather
# than two thirds of the way through a build. See docs/sirens-echo-compose.md.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: docker
    container: forgejo.coilysiren.me/coilyco-flight-deck/agentic-os:release
    services:
      jobstore:
        image: postgres@sha256:a426e44bac0b759c95894d68e1a0ac03ecc20b619f498a91aae373bf06d8508d
        env:
          POSTGRES_DB: sirens_jobs
          POSTGRES_USER: sirens
          POSTGRES_PASSWORD: sirens
    steps:
      - uses: actions/checkout@v6

      - name: build
        run: bash scripts/ci-command.sh just build

      - name: Neutral response policy
        run: bash scripts/ci-command.sh just policy-check

      - name: vet
        run: bash scripts/ci-command.sh just vet

      - name: test
        run: bash scripts/ci-command.sh just test

      - name: reviewed skip set
        run: bash scripts/ci-command.sh just test-skips

      - name: every role composes
        run: bash scripts/ci-command.sh just role-check

      - name: job store SQL
        env:
          SIRENS_ECHO_TEST_JOB_STORE_DSN: host=jobstore port=5432 user=sirens password=sirens dbname=sirens_jobs sslmode=disable
        run: bash scripts/ci-command.sh bash scripts/ci-job-store-sql.sh

      - name: pre-commit
        run: bash scripts/ci-command.sh pre-commit run --all-files --show-diff-on-failure

      - name: Alert Sentry on main failure
        if: ${{ failure() && github.ref == 'refs/heads/main' }}
        continue-on-error: true
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_CI_DSN }}
        run: python3 scripts/alert_sentry.py
  image-build:
    runs-on: docker
    container: forgejo.coilysiren.me/coilyco-flight-deck/agentic-os:release
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Build the image without publishing
        run: bash scripts/ci-image-build.sh

      - name: Report what the job container can see of the daemon
        if: ${{ failure() }}
        continue-on-error: true
        run: bash scripts/ci-docker-probe.sh

      - name: Alert Sentry on main failure
        if: ${{ failure() && github.ref == 'refs/heads/main' }}
        continue-on-error: true
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_CI_DSN }}
        run: python3 scripts/alert_sentry.py
  publish-echo-image:
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main'
    needs: [test]
    concurrency:
      group: publish-echo-image-${{ github.ref }}
      cancel-in-progress: false
    runs-on: deploy
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Publish immutable Sirens Echo image
        run: bash scripts/publish-image.sh

      - name: Alert Sentry on main failure
        if: ${{ failure() && github.ref == 'refs/heads/main' }}
        continue-on-error: true
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_CI_DSN }}
        run: python3 scripts/alert_sentry.py
  publish-observed:
    if: >-
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'
    needs: [publish-echo-image]
    runs-on: docker
    container: forgejo.coilysiren.me/coilyco-flight-deck/agentic-os:release
    steps:
      - uses: actions/checkout@v6

      - name: Fail unless this push published an image
        env:
          PUBLISH_RESULT: ${{ needs.publish-echo-image.result }}
        run: bash scripts/ci-publish-observed.sh

      - name: Alert Sentry on main failure
        if: ${{ failure() }}
        continue-on-error: true
        env:
          ALERT_KIND: Image publish
          SENTRY_DSN: ${{ secrets.SENTRY_CI_DSN }}
        run: python3 scripts/alert_sentry.py
