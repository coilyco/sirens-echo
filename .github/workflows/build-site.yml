# Uploads site/ as an Actions artifact. coilyco/deploy publishes it to S3 and alone
# holds the S3 keys (COI-3125). See docs/sirens-echo-deploy.md.
name: build-site

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "scripts/stage-site-artifact.sh"
      - ".github/workflows/build-site.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Stage the site artifact
        run: bash scripts/stage-site-artifact.sh

      - name: Upload the site artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: site-artifact
          retention-days: 90
          include-hidden-files: true
          if-no-files-found: error

      - name: Alert Sentry on failure
        if: ${{ failure() }}
        continue-on-error: true
        env:
          ALERT_KIND: Site artifact
          SENTRY_DSN: ${{ secrets.SENTRY_CI_DSN }}
        run: python3 scripts/alert_sentry.py
