name: image-coverage

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 40

      - name: Fail when main's tip has no published image
        env:
          IMAGE_HISTORY_REF: HEAD
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/ci-image-coverage.sh

      - name: Alert Sentry on missing image
        if: ${{ failure() }}
        continue-on-error: true
        env:
          ALERT_KIND: Image coverage
          SENTRY_DSN: ${{ secrets.SENTRY_CI_DSN }}
        run: python3 scripts/alert_sentry.py
