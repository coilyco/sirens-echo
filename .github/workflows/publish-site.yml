# Publishes site/ to discord.coilysiren.me. See docs/sirens-echo-deploy.md.
name: publish-site

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "scripts/publish-site.sh"
      - ".github/workflows/publish-site.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-site
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Publish site to discord.coilysiren.me
        env:
          PROJECT_SITES_PUBLISH_AWS_ACCESS_KEY_ID: ${{ secrets.PROJECT_SITES_PUBLISH_AWS_ACCESS_KEY_ID }}
          PROJECT_SITES_PUBLISH_AWS_SECRET_ACCESS_KEY: ${{ secrets.PROJECT_SITES_PUBLISH_AWS_SECRET_ACCESS_KEY }}
        run: bash scripts/publish-site.sh

      - name: Alert Sentry on failure
        if: ${{ failure() }}
        continue-on-error: true
        env:
          ALERT_KIND: Site publish
          SENTRY_DSN: ${{ secrets.SENTRY_CI_DSN }}
        run: python3 scripts/alert_sentry.py
